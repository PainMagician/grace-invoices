<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Grace Invoices">
<title>Grace Invoices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>
  :root {
    --cream: #FAF8F4;
    --warm-white: #FFFFFF;
    --ink: #1C1917;
    --ink-soft: #44403C;
    --ink-muted: #78716C;
    --sage: #6B7C6E;
    --sage-light: #E8EDE9;
    --sage-dark: #4A5C4D;
    --sand: #E8E0D4;
    --sand-dark: #C4B9A8;
    --accent: #C17F4A;
    --accent-light: #F5EAD9;
    --danger: #B45309;
    --danger-light: #FEF3C7;
    --success: #4A5C4D;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 4px 24px rgba(28,25,23,0.08);
    --shadow-lg: 0 8px 40px rgba(28,25,23,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--cream);
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  #root { height: 100%; }

  h1, h2, h3 { font-family: 'DM Serif Display', serif; font-weight: 400; }

  /* Layout */
  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 900px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    background: var(--warm-white);
    border-bottom: 1px solid var(--sand);
    padding: 20px 24px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-title { font-size: 26px; color: var(--ink); letter-spacing: -0.3px; }
  .header-sub { font-size: 13px; color: var(--ink-muted); margin-top: 2px; font-family: 'DM Sans', sans-serif; }

  /* Tab bar */
  .tabs {
    display: flex;
    background: var(--warm-white);
    border-bottom: 1px solid var(--sand);
    padding: 0 16px;
    gap: 4px;
  }
  .tab {
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-muted);
    border: none;
    background: none;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .tab.active {
    color: var(--sage-dark);
    border-bottom-color: var(--sage-dark);
  }

  /* Scrollable content */
  .content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 24px 20px 100px;
  }

  /* Cards */
  .card {
    background: var(--warm-white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 16px;
  }
  .card-title {
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    margin-bottom: 16px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .card-title .badge {
    background: var(--sage-light);
    color: var(--sage-dark);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.3px;
  }

  /* Form fields */
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--ink-muted);
    margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%;
    padding: 13px 16px;
    border: 1.5px solid var(--sand);
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    color: var(--ink);
    background: var(--cream);
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .field input:focus, .field select:focus {
    border-color: var(--sage);
    background: white;
  }
  .field input[readonly] {
    color: var(--ink-muted);
    background: var(--sand);
  }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .field-row-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }

  /* Info block */
  .info-block {
    background: var(--sage-light);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    font-size: 14px;
    color: var(--sage-dark);
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .info-block strong { font-weight: 600; }

  /* Class rows */
  .class-row {
    display: grid;
    grid-template-columns: 70px 80px 100px 1fr 65px 70px 80px 36px;
    gap: 7px;
    align-items: center;
    margin-bottom: 10px;
  }
  .class-row .field { margin-bottom: 0; }
  .class-header {
    display: grid;
    grid-template-columns: 70px 80px 100px 1fr 65px 70px 80px 36px;
    gap: 7px;
    margin-bottom: 6px;
    padding: 0 2px;
  }
  .class-header span {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--ink-muted);
  }
  .class-row input {
    width: 100%;
    padding: 12px 10px;
    border: 1.5px solid var(--sand);
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--ink);
    background: var(--cream);
    outline: none;
    transition: border-color 0.2s;
    text-align: center;
  }
  .class-row input.text-left { text-align: left; }
  .class-row input:focus {
    border-color: var(--sage);
    background: white;
  }

  /* Totals */
  .totals {
    background: var(--cream);
    border-radius: var(--radius-sm);
    padding: 16px 20px;
    margin-top: 8px;
  }
  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .total-row.final {
    border-top: 1.5px solid var(--sand-dark);
    margin-top: 6px;
    padding-top: 12px;
    font-size: 18px;
    font-family: 'DM Serif Display', serif;
    color: var(--ink);
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 24px;
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    white-space: nowrap;
    min-height: 50px;
  }
  .btn-primary {
    background: var(--sage-dark);
    color: white;
  }
  .btn-primary:active { background: var(--sage); }
  .btn-secondary {
    background: var(--sand);
    color: var(--ink);
  }
  .btn-secondary:active { background: var(--sand-dark); }
  .btn-accent {
    background: var(--accent);
    color: white;
  }
  .btn-accent:active { opacity: 0.85; }
  .btn-ghost {
    background: transparent;
    color: var(--ink-muted);
    padding: 10px;
    min-height: auto;
  }
  .btn-danger {
    background: var(--danger-light);
    color: var(--danger);
  }
  .btn-sm {
    padding: 9px 16px;
    font-size: 13px;
    min-height: 38px;
  }
  .btn-full { width: 100%; }
  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .btn-row .btn { flex: 1; min-width: 120px; }

  /* Add row button */
  .add-row-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border: 1.5px dashed var(--sand-dark);
    border-radius: var(--radius-sm);
    background: none;
    color: var(--ink-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
    margin-top: 4px;
    transition: all 0.2s;
    width: 100%;
  }
  .add-row-btn:active { background: var(--sand); }

  /* Delete row button */
  .del-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: none;
    background: var(--danger-light);
    color: var(--danger);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .del-btn:active { opacity: 0.7; }

  /* Invoice list */
  .invoice-item {
    background: var(--warm-white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 20px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .invoice-item-info { flex: 1; }
  .invoice-item-num {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    color: var(--ink);
  }
  .invoice-item-meta {
    font-size: 13px;
    color: var(--ink-muted);
    margin-top: 3px;
  }
  .invoice-item-amount {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    color: var(--sage-dark);
    text-align: right;
  }
  .invoice-actions {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 60px 30px;
    color: var(--ink-muted);
  }
  .empty-icon { font-size: 48px; margin-bottom: 16px; }
  .empty h3 { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--ink); margin-bottom: 8px; }
  .empty p { font-size: 15px; line-height: 1.6; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: white;
    padding: 14px 24px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 500;
    z-index: 1000;
    animation: toastIn 0.3s ease;
    white-space: nowrap;
    max-width: 90vw;
    text-align: center;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(28,25,23,0.5);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    padding: 0;
  }
  .modal {
    background: var(--warm-white);
    border-radius: 24px 24px 0 0;
    padding: 28px 24px 40px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-handle {
    width: 40px;
    height: 4px;
    background: var(--sand-dark);
    border-radius: 2px;
    margin: 0 auto 24px;
  }
  .modal-title {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    margin-bottom: 20px;
  }

  /* Calendar */
  .calendar {
    background: white;
    border-radius: var(--radius);
    padding: 16px;
  }
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .cal-month {
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
  }
  .cal-nav {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1.5px solid var(--sand);
    background: white;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-day-name {
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-muted);
    padding: 4px 0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .cal-day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    border: none;
    background: none;
    color: var(--ink);
    transition: all 0.15s;
  }
  .cal-day:active { background: var(--sand); }
  .cal-day.today { font-weight: 600; color: var(--sage-dark); }
  .cal-day.selected {
    background: var(--sage-dark);
    color: white;
  }
  .cal-day.other-month { color: var(--sand-dark); }
  .cal-day.empty { cursor: default; }

  /* Status indicator */
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
  }
  .status-dot.sent { background: var(--success); }
  .status-dot.draft { background: var(--accent); }

  /* Divider */
  .divider {
    border: none;
    border-top: 1px solid var(--sand);
    margin: 20px 0;
  }

  /* Scrollable on small screens */
  @media (max-width: 600px) {
    .class-header, .class-row {
      grid-template-columns: 55px 65px 80px 1fr 55px 60px 70px 32px;
      gap: 5px;
    }
    .card { padding: 18px; }
    .content { padding: 16px 14px 100px; }
  }

  /* Email setup banner */
  .setup-banner {
    background: var(--accent-light);
    border: 1.5px solid var(--accent);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    margin-bottom: 16px;
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.5;
  }
  .setup-banner strong { color: var(--accent); }

  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;
const { jsPDF } = window.jspdf;

// ─── Storage helpers ──────────────────────────────────────────────────────────
const STORAGE_KEY = 'grace_invoices_v1';
const SETTINGS_KEY = 'grace_invoices_settings_v1';
const BUSINESSES_KEY = 'grace_invoices_businesses_v1';

function loadInvoices() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch { return []; }
}
function saveInvoices(list) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}
function loadSettings() {
  try {
    const stored = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null');
    const defaults = {
      invoiceNumberOverride: '',
      bankAccountName: 'Grace Crossland-Scott',
      bankBSB: '484-799',
      bankAccountNumber: '051 713 949',
    };
    return stored ? { ...defaults, ...stored } : defaults;
  } catch {
    return { invoiceNumberOverride: '', bankAccountName: 'Grace Crossland-Scott', bankBSB: '484-799', bankAccountNumber: '051 713 949' };
  }
}
function saveSettings(s) {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
}

// ─── Business helpers ─────────────────────────────────────────────────────────
function generateBusinessId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function prefixFromName(name) {
  if (!name) return 'INV';
  const words = name.trim().split(/\s+/);
  return words.map(w => w[0]?.toUpperCase() || '').join('').slice(0, 6) || 'INV';
}

function defaultBusiness() {
  // Migrate from old regularClasses if present
  const oldSettings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null');
  const oldClasses = oldSettings?.regularClasses || [{ time: '6:15pm', className: 'Yoga - Forest Lake', duration: '60', price: '70' }];
  return {
    id: generateBusinessId(),
    name: 'Snap Fitness',
    email: 'brisbanegfm@tbhgroup.com.au',
    contactName: '',
    contactPhone: '',
    invoicePrefix: 'SF',
    nextNumber: 108,
    regularClasses: oldClasses,
    isDefault: true,
  };
}

function loadBusinesses() {
  try {
    const stored = JSON.parse(localStorage.getItem(BUSINESSES_KEY) || 'null');
    if (stored && stored.length) return stored;
    // First run — create default Snap Fitness business
    const biz = [defaultBusiness()];
    localStorage.setItem(BUSINESSES_KEY, JSON.stringify(biz));
    return biz;
  } catch {
    return [defaultBusiness()];
  }
}
function saveBusinesses(list) {
  localStorage.setItem(BUSINESSES_KEY, JSON.stringify(list));
}
function getDefaultBusiness() {
  const businesses = loadBusinesses();
  return businesses.find(b => b.isDefault) || businesses[0];
}
function getNextInvoiceNumberForBusiness(business, allInvoices) {
  const settings = loadSettings();
  // Check for per-business override stored as override_<id>
  const overrideKey = `invoiceOverride_${business.id}`;
  if (settings[overrideKey]) {
    const val = settings[overrideKey];
    const updated = { ...settings };
    delete updated[overrideKey];
    saveSettings(updated);
    return val.trim().toUpperCase();
  }
  // Use per-business counter
  const prefix = business.invoicePrefix || prefixFromName(business.name);
  const startNum = business.nextNumber || 108;
  // Find highest existing number for this business
  const bizInvoices = allInvoices.filter(inv => inv.businessId === business.id);
  if (!bizInvoices.length) return `${prefix}${startNum}`;
  const nums = bizInvoices.map(i => parseInt(i.invoiceNumber.replace(/[^0-9]/g, '')) || 0);
  return `${prefix}${Math.max(...nums) + 1}`;
}

// ─── Invoice number helpers (legacy shim) ────────────────────────────────────
function getNextInvoiceNumber(invoices) {
  const biz = getDefaultBusiness();
  return getNextInvoiceNumberForBusiness(biz, invoices);
}

// ─── Date helpers ─────────────────────────────────────────────────────────────
function todayStr() {
  const d = new Date();
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}
function parseDate(str) {
  const [d,m,y] = str.split('/').map(Number);
  return new Date(y, m-1, d);
}
function formatDate(date) {
  return `${String(date.getDate()).padStart(2,'0')}/${String(date.getMonth()+1).padStart(2,'0')}/${date.getFullYear()}`;
}
function formatDateShort(date) {
  return `${String(date.getDate()).padStart(2,'0')}/${String(date.getMonth()+1).padStart(2,'0')}/${String(date.getFullYear()).slice(2)}`;
}
const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
// Returns short day name from dd/mm/yy string, e.g. "Thu"
function dayFromDateShort(str) {
  if (!str) return '';
  const parts = str.split('/');
  if (parts.length !== 3) return '';
  const [d, m, y] = parts.map(Number);
  const year = y < 100 ? 2000 + y : y;
  const date = new Date(year, m - 1, d);
  return isNaN(date.getTime()) ? '' : DAY_NAMES[date.getDay()];

// ─── PDF Generator ────────────────────────────────────────────────────────────
function generatePDF(invoice) {
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, margin = 20;

  // Background
  doc.setFillColor(250, 248, 244);
  doc.rect(0, 0, W, 297, 'F');

  // Taller header bar to accommodate logo + padding
  doc.setFillColor(74, 92, 77);
  doc.rect(0, 0, W, 60, 'F');

  // Logo — centred, 36mm wide, 6mm top padding
  const logoW = 36, logoH = 36;
  const logoX = (W - logoW) / 2;
  try { doc.addImage(LOGO_B64, 'PNG', logoX, 5, logoW, logoH); } catch(e) {}

  // Invoice line below logo
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(14);
  doc.setTextColor(255, 255, 255);
  doc.text(`INVOICE  #  ${invoice.invoiceNumber}`, margin, 54);
  doc.text(`Date: ${invoice.date}`, W - margin, 54, { align: 'right' });

  // From / To columns
  const col1 = margin, col2 = 115;
  let y = 74;

  doc.setTextColor(120, 113, 108);
  doc.setFontSize(8);
  doc.setFont('helvetica', 'bold');
  doc.text('FROM', col1, y);
  doc.text('TO', col2, y);
  y += 6;

  doc.setTextColor(28, 25, 23);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(12);
  doc.text('Grace Crossland-Scott', col1, y);
  doc.text(invoice.businessName || 'Snap Fitness', col2, y);
  y += 6;

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.setTextColor(68, 64, 60);
  doc.text('ABN 59 726 072 982', col1, y);
  doc.text(invoice.businessEmail || 'brisbanegfm@tbhgroup.com.au', col2, y);
  y += 5;
  doc.text('gr8shapegrace@gmail.com', col1, y);
  y += 5;
  doc.text('Phone 0418 208 866', col1, y);
  y += 5;
  doc.text('Not Registered for GST', col1, y);

  // Gap between from/to block and table — same as gap between table and bottom cards
  y += 14;

  // Table
  const filledRows = invoice.rows.filter(r => r.className || r.attendance || r.unitPrice);

  const head = [['Day', 'Time', 'Date', 'Class', 'Duration (mins)', 'Attendance', 'Unit Price']];
  const body = filledRows.map(r => [
    dayFromDateShort(r.classDate) || r.day || '',
    r.time || '',
    r.classDate || '',
    r.className || '',
    r.duration || '',
    r.attendance || '',
    r.unitPrice ? `$${parseFloat(r.unitPrice).toFixed(2)}` : '$0.00'
  ]);

  // Table — clean rounded card with perfectly aligned header fill
  const tableStartY = y;
  const tableW = W - margin * 2;
  const tblMargin = { left: margin + 1, right: margin + 1 };
  const colStyles = {
    0: { cellWidth: 11 },    // Day
    1: { cellWidth: 15 },    // Time
    2: { cellWidth: 20, overflow: 'visible' }, // Date — must not wrap
    3: { cellWidth: 'auto' },// Class
    4: { cellWidth: 22 },    // Duration (mins)
    5: { cellWidth: 22 },    // Attendance
    6: { cellWidth: 22 },    // Unit Price
  };
  const cellPadH = { top: 4, bottom: 4, left: 2, right: 2 };
  const cellPadB = { top: 5, bottom: 5, left: 2, right: 2 };

  // Dry run (invisible) to measure exact finalY and header row height
  let measuredHdrH = 0;
  doc.autoTable({
    startY: tableStartY,
    head, body,
    theme: 'plain',
    headStyles: { fillColor: [250,248,244], textColor: [250,248,244], lineWidth: 0, cellPadding: cellPadH, fontSize: 9, fontStyle: 'bold' },
    bodyStyles: { fillColor: [250,248,244], textColor: [250,248,244], lineWidth: 0, cellPadding: cellPadB, fontSize: 10 },
    alternateRowStyles: { fillColor: [250,248,244] },
    styles: { lineWidth: 0, overflow: 'linebreak' },
    columnStyles: colStyles,
    margin: tblMargin,
    didDrawCell(data) {
      if (data.section === 'head' && data.column.index === 0) {
        measuredHdrH = data.cell.height;
      }
    },
  });
  const tableH = doc.lastAutoTable.finalY - tableStartY;

  // Draw full card background (white, rounded)
  doc.setFillColor(255, 255, 255);
  doc.roundedRect(margin, tableStartY, tableW, tableH, 4, 4, 'F');

  // Draw header fill exactly matching measured height:
  // Use a rounded rect for the whole header zone, then overdraw bottom portion with white
  // so only the top rounded corners are curved and the bottom is flat
  doc.setFillColor(232, 237, 233);
  doc.roundedRect(margin, tableStartY, tableW, measuredHdrH, 4, 4, 'F');
  // Overdraw bottom ~4mm of header zone with white to remove the bottom rounded corners
  doc.setFillColor(255, 255, 255);
  doc.rect(margin, tableStartY + measuredHdrH - 4, tableW, 4, 'F');
  // Redraw the header fill as a plain rect in the bottom portion (flat bottom edge)
  doc.setFillColor(232, 237, 233);
  doc.rect(margin, tableStartY + measuredHdrH - 4, tableW, 4, 'F');

  // Real render — transparent fills, text only drawn on top of backgrounds
  doc.autoTable({
    startY: tableStartY,
    head, body,
    theme: 'plain',
    headStyles: {
      fillColor: false,
      textColor: [74, 92, 77],
      fontStyle: 'bold',
      fontSize: 9,
      cellPadding: cellPadH,
      lineWidth: 0,
    },
    bodyStyles: {
      fillColor: false,
      fontSize: 10,
      cellPadding: cellPadB,
      textColor: [28, 25, 23],
      lineWidth: 0,
    },
    alternateRowStyles: { fillColor: false },
    styles: { lineWidth: 0, overflow: 'linebreak' },
    columnStyles: colStyles,
    margin: tblMargin,
    didDrawCell(data) {
      // Draw divider line exactly at the bottom of the header row
      if (data.section === 'head' && data.column.index === 0) {
        const lineY = data.cell.y + data.cell.height;
        doc.setDrawColor(200, 210, 200);
        doc.setLineWidth(0.4);
        doc.line(margin, lineY, margin + tableW, lineY);
      }
    },
  });

  // Rounded stroke border — drawn last, sits on top
  doc.setDrawColor(200, 210, 200);
  doc.setLineWidth(0.6);
  doc.roundedRect(margin, tableStartY, tableW, tableH, 4, 4, 'S');

  // ── Layout constants for bottom two cards ──
  const cardTop = doc.lastAutoTable.finalY + 8;
  const cardPad = 7;    // inner horizontal padding
  const cardH = 52;     // tall enough for 3 rows + divider with equal breathing room

  // ── Totals card ──
  const totalsBoxX = W / 2 + 4;
  const totalsBoxW = W - margin - totalsBoxX;
  const totalsInnerL = totalsBoxX + cardPad;
  const totalsInnerR = totalsBoxX + totalsBoxW - cardPad;

  doc.setFillColor(232, 237, 233);
  doc.roundedRect(totalsBoxX, cardTop, totalsBoxW, cardH, 4, 4, 'F');

  // Evenly space: topPad, line1, gap, line2, gap, divider, gap, line3, botPad
  // Use fixed rhythm: lines at +9, +20, divider at +30, line3 at +42
  const line1Y = cardTop + 11;
  doc.setFontSize(10);
  doc.setTextColor(68, 64, 60);
  doc.setFont('helvetica', 'normal');
  doc.text('Sub Total', totalsInnerL, line1Y);
  doc.text(`$${invoice.subtotal.toFixed(2)}`, totalsInnerR, line1Y, { align: 'right' });

  const line2Y = cardTop + 22;
  doc.text('Total GST', totalsInnerL, line2Y);
  doc.text('$0.00', totalsInnerR, line2Y, { align: 'right' });

  // Divider — inset to text edges, centred between line2 and line3
  const divY = cardTop + 31;
  doc.setDrawColor(120, 113, 108);
  doc.setLineWidth(0.4);
  doc.line(totalsInnerL, divY, totalsInnerR, divY);

  // Total Amount — sits comfortably inside card bottom
  const line3Y = cardTop + 44;
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(12);
  doc.setTextColor(74, 92, 77);
  doc.text('Total Amount', totalsInnerL, line3Y);
  doc.text(`$${invoice.total.toFixed(2)}`, totalsInnerR, line3Y, { align: 'right' });

  // ── Banking card — same height, vertically centred content ──
  const bankSettings = loadSettings();
  const bankBoxX = margin;
  const bankBoxW = W / 2 - margin - 4;
  const bankInnerL = bankBoxX + cardPad;

  doc.setFillColor(232, 237, 233);
  doc.roundedRect(bankBoxX, cardTop, bankBoxW, cardH, 4, 4, 'F');

  const bankLines = [
    { label: '',              value: 'BANKING DETAILS', bold: true,  size: 8,  labelColor: [74, 92, 77],  valueColor: [74, 92, 77] },
    { label: 'Account Name: ', value: bankSettings.bankAccountName || 'Grace Crossland-Scott', bold: true, size: 9, labelColor: [68, 64, 60], valueColor: [28, 25, 23] },
    { label: 'BSB: ',          value: (bankSettings.bankBSB || '484799').replace(/-/g, ''),    bold: true, size: 9, labelColor: [68, 64, 60], valueColor: [28, 25, 23] },
    { label: 'Account #: ',    value: bankSettings.bankAccountNumber || '051 713 949',         bold: true, size: 9, labelColor: [68, 64, 60], valueColor: [28, 25, 23] },
  ];
  const lineSpacing = 7;
  const totalTextH = (bankLines.length - 1) * lineSpacing;
  const bankTextStartY = cardTop + (cardH - totalTextH) / 2 + 2;

  bankLines.forEach((line, i) => {
    const lineY = bankTextStartY + i * lineSpacing;
    doc.setFontSize(line.size);
    // Draw label (normal weight)
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(...line.labelColor);
    const labelW = line.label ? doc.getTextWidth(line.label) : 0;
    if (line.label) doc.text(line.label, bankInnerL, lineY);
    // Draw value (bold)
    doc.setFont('helvetica', line.bold ? 'bold' : 'normal');
    doc.setTextColor(...line.valueColor);
    doc.text(line.value, bankInnerL + labelW, lineY);
  });

  return doc;
}

// ─── Calendar Component ───────────────────────────────────────────────────────
function Calendar({ value, onChange, onClose }) {
  const today = new Date();
  const initial = value ? parseDate(value) : today;
  const [view, setView] = useState({ year: initial.getFullYear(), month: initial.getMonth() });

  const DAYS = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  const firstDay = new Date(view.year, view.month, 1).getDay();
  const daysInMonth = new Date(view.year, view.month + 1, 0).getDate();
  const daysInPrev = new Date(view.year, view.month, 0).getDate();

  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push({ day: daysInPrev - firstDay + 1 + i, other: true });
  for (let d = 1; d <= daysInMonth; d++) cells.push({ day: d, other: false });
  while (cells.length % 7 !== 0) cells.push({ day: cells.length - daysInMonth - firstDay + 1, other: true });

  const selDate = value ? parseDate(value) : null;

  function prevMonth() {
    setView(v => v.month === 0 ? { year: v.year-1, month: 11 } : { year: v.year, month: v.month-1 });
  }
  function nextMonth() {
    setView(v => v.month === 11 ? { year: v.year+1, month: 0 } : { year: v.year, month: v.month+1 });
  }

  return (
    <div className="calendar">
      <div className="cal-header">
        <button className="cal-nav" onClick={prevMonth}>‹</button>
        <span className="cal-month">{MONTHS[view.month]} {view.year}</span>
        <button className="cal-nav" onClick={nextMonth}>›</button>
      </div>
      <div className="cal-grid">
        {DAYS.map(d => <div key={d} className="cal-day-name">{d}</div>)}
        {cells.map((cell, i) => {
          const isToday = !cell.other && cell.day === today.getDate() && view.month === today.getMonth() && view.year === today.getFullYear();
          const isSel = selDate && !cell.other && cell.day === selDate.getDate() && view.month === selDate.getMonth() && view.year === selDate.getFullYear();
          return (
            <button
              key={i}
              className={`cal-day ${isToday ? 'today' : ''} ${isSel ? 'selected' : ''} ${cell.other ? 'other-month' : ''}`}
              onClick={() => {
                if (!cell.other) {
                  onChange(formatDate(new Date(view.year, view.month, cell.day)));
                  onClose();
                }
              }}
            >{cell.day}</button>
          );
        })}
      </div>
    </div>
  );
}

    id: generateBusinessId(),

    email: '',

  });

  // Auto-generate prefix from name

    const auto = prefixFromName(val);
    setBiz(b => ({ ...b, name: val, invoicePrefix: b.invoicePrefix === prefixFromName(b.name) || !b.invoicePrefix ? auto : b.invoicePrefix }));
  }

  function updateClass(i, field, val) {
    setBiz(b => ({ ...b, regularClasses: b.regularClasses.map((c, idx) => idx === i ? { ...c, [field]: val } : c) }));
  }
  function addClass() {
    setBiz(b => ({ ...b, regularClasses: [...b.regularClasses, { time: '6:15pm', className: '', duration: '60', price: '70' }] }));
  }

  function handleSave() {

        <div className="field-row">

            <input value={cls.duration} onChange={e => updateClass(i,'duration',e.target.value)} placeholder="60" type="number" style={{...clsInput, textAlign:'center'}} />

function InvoiceForm({ existing, invoices, onSave, onCancel, showToast }) {
  const isEdit = !!existing;
  const businesses = loadBusinesses();
  const defaultBiz = existing?.businessId
    ? (businesses.find(b => b.id === existing.businessId) || businesses[0])
    : (businesses.find(b => b.isDefault) || businesses[0]);

  const [selectedBiz, setSelectedBiz] = useState(defaultBiz);
  const [showBizPicker, setShowBizPicker] = useState(false);
  const [showAddBiz, setShowAddBiz] = useState(false);
  const [allBusinesses, setAllBusinesses] = useState(businesses);

  const [invoiceNumber, setInvoiceNumber] = useState(
    existing?.invoiceNumber || getNextInvoiceNumberForBusiness(defaultBiz, invoices)
  );
  const [date, setDate] = useState(existing?.date || todayStr());
  const [showCal, setShowCal] = useState(false);
  const [rowCal, setRowCal] = useState(null);
  const [rows, setRows] = useState(existing?.rows || defaultRowsForBusiness(defaultBiz));

  // When business changes, update invoice number and rows
  function selectBusiness(biz) {
    setSelectedBiz(biz);
    setInvoiceNumber(getNextInvoiceNumberForBusiness(biz, invoices));
    if (!isEdit) setRows(defaultRowsForBusiness(biz));
    setShowBizPicker(false);
  }

  function handleAddBusiness(newBiz) {
    const updated = [...allBusinesses, newBiz];
    saveBusinesses(updated);
    setAllBusinesses(updated);
    setShowAddBiz(false);
    selectBusiness(newBiz);
  }

  const subtotal = rows.reduce((s, r) => s + (parseFloat(r.unitPrice) || 0), 0);
  const total = subtotal;

  function updateRow(i, field, val) {
    setRows(r => r.map((row, idx) => idx === i ? { ...row, [field]: val } : row));
  }
  function addRow() {
    const first = selectedBiz?.regularClasses?.[0] || {};
    setRows(r => [...r, { time: first.time || '6:15pm', classDate: '', className: first.className || '', duration: first.duration || '60', attendance: '', unitPrice: first.price || '70' }]);
  }
  function removeRow(i) {
    if (rows.length === 1) return;
    setRows(r => r.filter((_, idx) => idx !== i));
    setRowErrors(e => e.filter((_, idx) => idx !== i));
  }

  const [rowErrors, setRowErrors] = useState([]);

  function handleSave() {
    const filledRows = rows.filter(r => r.className);
    if (!filledRows.length) { showToast('Please add at least one class'); return; }
    const errors = rows.map(r => {
      if (!r.className) return '';
      if (!r.classDate) return 'Select a date';
      if (!r.attendance) return 'Enter attendance';
      return '';
    });
    setRowErrors(errors);
    if (errors.some(e => e)) {
      showToast(errors.some(e => e === 'Select a date') ? '⚠️ Please select a date for all classes' : '⚠️ Please enter attendance for all classes');
      return;
    }
    const invoice = {
      id: existing?.id || Date.now().toString(),
      invoiceNumber,
      date,
      rows,
      subtotal,
      total,
      businessId: selectedBiz.id,
      businessName: selectedBiz.name,
      businessEmail: selectedBiz.email,
      createdAt: existing?.createdAt || new Date().toISOString(),
      status: existing?.status || 'draft',
    };
    onSave(invoice);
  }

  return (
    <div>
      {/* Add Business modal — rendered at top level so it sits above business picker */}
      {showAddBiz && (
        <BusinessModal
          onSave={handleAddBusiness}
          onClose={() => setShowAddBiz(false)}
        />
      )}

      {/* Business picker modal */}
      {showBizPicker && !showAddBiz && (
        <div className="modal-overlay" onClick={() => setShowBizPicker(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-handle" />
            <div className="modal-title">Bill To</div>
            {allBusinesses.map(biz => (
              <div key={biz.id} onClick={() => selectBusiness(biz)}
                style={{ padding: '14px 16px', borderRadius: 10, marginBottom: 8, background: biz.id === selectedBiz?.id ? 'var(--sage-light)' : 'var(--cream)', cursor: 'pointer', border: `1.5px solid ${biz.id === selectedBiz?.id ? 'var(--sage-dark)' : 'var(--sand)'}` }}>
                <div style={{ fontWeight: 600, fontSize: 15, color: 'var(--ink)' }}>{biz.name}</div>
                <div style={{ fontSize: 13, color: 'var(--ink-muted)', marginTop: 2 }}>{biz.email}</div>
              </div>
            ))}
            <button className="add-row-btn" style={{ marginTop: 8 }} onClick={e => { e.stopPropagation(); setShowBizPicker(false); setShowAddBiz(true); }}>
              <span>＋</span> Add new business
            </button>
          </div>
        </div>
      )}

      {/* Invoice date calendar */}
      {showCal && (
        <div className="modal-overlay" onClick={() => setShowCal(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-handle" />
            <div className="modal-title">Invoice Date</div>
            <Calendar value={date} onChange={setDate} onClose={() => setShowCal(false)} />
          </div>
        </div>
      )}

      {/* Row date calendar */}
      {rowCal !== null && (
        <div className="modal-overlay" onClick={() => setRowCal(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-handle" />
            <div className="modal-title">Class Date — Row {rowCal + 1}</div>
            <Calendar
              value={rows[rowCal]?.classDate ? (() => {
                const parts = rows[rowCal].classDate.split('/');
                if (parts[2]?.length === 2) return `${parts[0]}/${parts[1]}/20${parts[2]}`;
                return rows[rowCal].classDate;
              })() : null}
              onChange={val => {
                const parts = val.split('/');
                const short = `${parts[0]}/${parts[1]}/${parts[2].slice(2)}`;
                updateRow(rowCal, 'classDate', short);
                setRowErrors(errs => errs.map((err, idx) => idx === rowCal ? '' : err));
              }}
              onClose={() => setRowCal(null)}
            />
          </div>
        </div>
      )}

      <div className="card">
        <div className="card-title">Invoice Details</div>
        <div className="field-row">
          <div className="field">
            <label>Invoice #</label>
            <input value={invoiceNumber} onChange={e => setInvoiceNumber(e.target.value)} style={{ background: 'white' }} />
          </div>
          <div className="field">
            <label>Date</label>
            <input value={date} readOnly onClick={() => setShowCal(true)} style={{ cursor: 'pointer', background: 'white' }} />
          </div>
        </div>

        {/* Bill To selector */}
        <div className="field" style={{ marginBottom: 8 }}>
          <label>Bill To</label>
          <div onClick={() => setShowBizPicker(true)}
            style={{ padding: '13px 16px', border: '1.5px solid var(--sand)', borderRadius: 10, background: 'white', cursor: 'pointer', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div>
              <div style={{ fontWeight: 600, fontSize: 15, color: 'var(--ink)' }}>{selectedBiz?.name || 'Select business'}</div>
              {selectedBiz?.email && <div style={{ fontSize: 12, color: 'var(--ink-muted)', marginTop: 2 }}>{selectedBiz.email}</div>}
            </div>
            <span style={{ color: 'var(--ink-muted)', fontSize: 18 }}>›</span>
          </div>
        </div>

        <div className="info-block">
          <strong>From:</strong> Grace Crossland-Scott · ABN 59 726 072 982 · Not registered for GST
        </div>
      </div>

      <div className="card">
        <div className="card-title">
          Classes
          <span className="badge">{rows.filter(r => r.className).length} added</span>
        </div>

        <div className="class-header">
          <span>Day</span>
          <span>Time</span>
          <span>Date</span>
          <span>Class</span>
          <span>Mins</span>
          <span>Attend.</span>
          <span>$ Price</span>
          <span></span>
        </div>

        {rows.map((row, i) => (
          <div className="class-row" key={i}>
            <input
              value={dayFromDateShort(row.classDate)}
              readOnly
              style={{ background: 'var(--sand)', color: 'var(--ink-soft)', textAlign: 'center', cursor: 'default' }}
            />
            <input
              placeholder="6:15pm"
              value={row.time}
              onChange={e => updateRow(i, 'time', e.target.value)}
              className="text-left"
            />
            <input
              placeholder="Tap to select"
              value={row.classDate}
              readOnly
              onClick={() => setRowCal(i)}
              style={{ cursor: 'pointer', background: 'white', ...(rowErrors[i] === 'Select a date' ? { borderColor: 'var(--danger)', background: '#FFF5F0' } : {}) }}
            />
            <input
              placeholder="Yoga - Forest Lake"
              value={row.className}
              onChange={e => updateRow(i, 'className', e.target.value)}
              className="text-left"
            />
            <input
              placeholder="60"
              type="number"
              value={row.duration}
              onChange={e => updateRow(i, 'duration', e.target.value)}
            />
            <input
              type="number"
              value={row.attendance}
              onChange={e => {
                updateRow(i, 'attendance', e.target.value);
                setRowErrors(errs => errs.map((err, idx) => idx === i ? '' : err));
              }}
              style={rowErrors[i] ? { borderColor: 'var(--danger)', background: '#FFF5F0' } : {}}
            />
            <input
              placeholder="70"
              type="number"
              value={row.unitPrice}
              onChange={e => updateRow(i, 'unitPrice', e.target.value)}
            />
            <button className="del-btn" onClick={() => removeRow(i)}>×</button>
          </div>
        ))}

        <button className="add-row-btn" onClick={addRow}>
          <span>＋</span> Add class
        </button>

        <div className="totals">
          <div className="total-row">
            <span>Sub Total</span>
            <span>${subtotal.toFixed(2)}</span>
          </div>
          <div className="total-row">
            <span>Total GST</span>
            <span>$0.00</span>
          </div>
          <div className="total-row final">
            <span>Total Amount</span>
            <span>${total.toFixed(2)}</span>
          </div>
        </div>
      </div>

      <div className="btn-row">
        {onCancel && <button className="btn btn-secondary" onClick={onCancel}>Cancel</button>}
        <button className="btn btn-primary" onClick={handleSave}>
          {isEdit ? '✓ Save Changes' : '✓ Save Invoice'}
        </button>
      </div>
    </div>
  );
}

// ─── Settings Modal ───────────────────────────────────────────────────────────
function SettingsModal({ onClose, showToast, onSettingsSaved }) {
  const [s, setS] = useState(loadSettings());
  const [businesses, setBusinesses] = useState(loadBusinesses());
  const [editingBiz, setEditingBiz] = useState(null);
  const [confirmDeleteBiz, setConfirmDeleteBiz] = useState(null);
  const [showAddBiz, setShowAddBiz] = useState(false);

  function handleSaveBusiness(biz) {
    const updated = businesses.some(b => b.id === biz.id)
      ? businesses.map(b => b.id === biz.id ? biz : b)
      : [...businesses, biz];
    saveBusinesses(updated);
    setBusinesses(updated);
    setEditingBiz(null);
    setShowAddBiz(false);
  }
  function handleDeleteBiz(id) {
    if (businesses.length <= 1) { showToast('Must keep at least one business'); return; }
    const updated = businesses.filter(b => b.id !== id);
    // If deleting default, make first remaining the default
    if (!updated.find(b => b.isDefault)) updated[0].isDefault = true;
    saveBusinesses(updated);
    setBusinesses(updated);
    setConfirmDeleteBiz(null);
  }
  function setDefault(id) {
    const updated = businesses.map(b => ({ ...b, isDefault: b.id === id }));
    saveBusinesses(updated);
    setBusinesses(updated);
  }

  function handleSave() {
    saveSettings(s);
    onSettingsSaved();
    showToast('✓ Settings saved');
    onClose();
  }

  const sectionHead = (icon, label) => (
    <div style={{ fontSize: 13, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.8px', color: 'var(--sage-dark)', marginBottom: 10, display: 'flex', alignItems: 'center', gap: 8 }}>
      <span>{icon}</span> {label}
    </div>
  );

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={{ maxHeight: '90vh' }} onClick={e => e.stopPropagation()}>
        <div className="modal-handle" />
        <div className="modal-title">Settings</div>

        {(editingBiz || showAddBiz) && (
          <BusinessModal
            existing={editingBiz || null}
            onSave={handleSaveBusiness}
            onClose={() => { setEditingBiz(null); setShowAddBiz(false); }}
          />
        )}
        {confirmDeleteBiz && (
          <div className="modal-overlay" onClick={() => setConfirmDeleteBiz(null)}>
            <div className="modal" onClick={e => e.stopPropagation()}>
              <div className="modal-handle" />
              <div className="modal-title">Remove Business?</div>
              <p style={{ color: 'var(--ink-soft)', marginBottom: 24 }}>Remove <strong>{confirmDeleteBiz.name}</strong>? This won't affect existing invoices.</p>
              <div className="btn-row">
                <button className="btn btn-secondary" onClick={() => setConfirmDeleteBiz(null)}>Cancel</button>
                <button className="btn btn-danger" onClick={() => handleDeleteBiz(confirmDeleteBiz.id)}>Remove</button>
              </div>
            </div>
          </div>
        )}

        {/* ── Businesses ── */}
        <div style={{ marginBottom: 24 }}>
          {sectionHead('🏢', 'Businesses')}
          {businesses.map(biz => (
            <div key={biz.id} style={{ background: 'var(--cream)', borderRadius: 10, padding: '12px 14px', marginBottom: 10, border: '1.5px solid var(--sand)' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 600, fontSize: 15, color: 'var(--ink)', display: 'flex', alignItems: 'center', gap: 8 }}>
                    {biz.name}
                    {biz.isDefault && <span style={{ fontSize: 11, background: 'var(--sage-light)', color: 'var(--sage-dark)', padding: '2px 8px', borderRadius: 10, fontWeight: 600 }}>Default</span>}
                  </div>
                  <div style={{ fontSize: 13, color: 'var(--ink-muted)', marginTop: 3 }}>{biz.email}</div>
                  <div style={{ fontSize: 12, color: 'var(--ink-muted)', marginTop: 2 }}>Prefix: <strong>{biz.invoicePrefix || prefixFromName(biz.name)}</strong> · {biz.regularClasses?.length || 0} class{biz.regularClasses?.length !== 1 ? 'es' : ''}</div>
                </div>
                <div style={{ display: 'flex', gap: 6, marginLeft: 8 }}>
                  {!biz.isDefault && <button className="btn btn-secondary btn-sm" onClick={() => setDefault(biz.id)}>Set Default</button>}
                  <button className="btn btn-secondary btn-sm" onClick={() => setEditingBiz(biz)}>✏️</button>
                  <button className="btn btn-danger btn-sm" onClick={() => setConfirmDeleteBiz(biz)}>🗑</button>
                </div>
              </div>
            </div>
          ))}
          <button className="add-row-btn" onClick={() => setShowAddBiz(true)}><span>＋</span> Add business</button>
        </div>

        <hr className="divider" />

        {/* ── Banking Details ── */}
        <div style={{ marginBottom: 24 }}>
          {sectionHead('🏦', 'Banking Details')}
          <div className="field">
            <label>Account Name</label>
            <input placeholder="Grace Crossland-Scott" value={s.bankAccountName} onChange={e => setS({...s, bankAccountName: e.target.value})} />
          </div>
          <div className="field-row">
            <div className="field">
              <label>BSB</label>
              <input placeholder="484799" value={s.bankBSB} onChange={e => setS({...s, bankBSB: e.target.value})} />
            </div>
            <div className="field">
              <label>Account Number</label>
              <input placeholder="051 713 949" value={s.bankAccountNumber} onChange={e => setS({...s, bankAccountNumber: e.target.value})} />
            </div>
          </div>
        </div>

        <hr className="divider" />

        {/* ── Email ── */}
        <div>
          {sectionHead('✉️', 'Sending Invoices')}
          <div className="info-block">
            Tapping <strong>✉️ Email</strong> on any invoice will:<br/><br/>
            1. Save the PDF to your iPad Files<br/>
            2. Open Mail pre-addressed to the business<br/>
            3. Tap the paperclip → attach the PDF → Send
          </div>
        </div>

        <div className="btn-row">
          <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={handleSave}>Save Settings</button>
        </div>
      </div>
    </div>
  );
}

// ─── Invoice List ─────────────────────────────────────────────────────────────
function InvoiceList({ invoices, setInvoices, onEdit, showToast }) {
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [mailPrompt, setMailPrompt] = useState(null); // { invoice, mailtoUrl }

  function handleEmail(invoice) {
    try {
      const doc = generatePDF(invoice);
      const filename = `Grace Crossland-Scott ${invoice.invoiceNumber}.pdf`;
      doc.save(filename);

      const bizEmail = invoice.businessEmail || 'brisbanegfm@tbhgroup.com.au';
      const bizName = invoice.businessName || 'Snap Fitness';
      const subject = encodeURIComponent(`Invoice ${invoice.invoiceNumber} — Grace Crossland-Scott`);
      const body = encodeURIComponent(
        `Hi,\n\nPlease find attached invoice ${invoice.invoiceNumber} dated ${invoice.date} for $${invoice.total.toFixed(2)}.\n\nRegards,\nGrace Crossland-Scott`
      );
      const mailtoUrl = `mailto:${bizEmail}?subject=${subject}&body=${body}`;

      const updated = invoices.map(i => i.id === invoice.id ? { ...i, status: 'sent' } : i);
      setInvoices(updated);
      saveInvoices(updated);
      setMailPrompt({ invoice, mailtoUrl, bizName });
    } catch (err) {
      console.error(err);
      showToast('Something went wrong');
    }
  }

  function handleDownload(invoice) {
    const doc = generatePDF(invoice);
    doc.save(`Grace Crossland-Scott ${invoice.invoiceNumber}.pdf`);
    showToast('✓ PDF saved');
  }

  function handleDuplicate(invoice) {
    const newInv = {
      ...invoice,
      id: Date.now().toString(),
      invoiceNumber: getNextInvoiceNumber(invoices),
      date: todayStr(),
      status: 'draft',
      createdAt: new Date().toISOString(),
    };
    const updated = [...invoices, newInv];
    setInvoices(updated);
    saveInvoices(updated);
    showToast('✓ Invoice duplicated');
  }

  function handleDelete(id) {
    const updated = invoices.filter(i => i.id !== id);
    setInvoices(updated);
    saveInvoices(updated);
    setConfirmDelete(null);
    showToast('Deleted');
  }

  if (!invoices.length) {
    return (
      <div className="empty">
        <div className="empty-icon">🧾</div>
        <h3>No invoices yet</h3>
        <p>Tap "New Invoice" to create your first one. It'll appear here once saved.</p>
      </div>
    );
  }

  const sorted = [...invoices].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

  return (
    <div>
      {/* Mail prompt modal — shown after PDF saves, user taps to open Mail (iOS requires direct tap) */}
      {mailPrompt && (
        <div className="modal-overlay" onClick={() => setMailPrompt(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-handle" />
            <div className="modal-title">✓ PDF Saved!</div>
            <p style={{ color: 'var(--ink-soft)', marginBottom: 8, lineHeight: 1.6 }}>
              <strong>Grace Crossland-Scott {mailPrompt.invoice.invoiceNumber}.pdf</strong> has been saved to your Files.
            </p>
            <p style={{ color: 'var(--ink-soft)', marginBottom: 24, lineHeight: 1.6 }}>
              Tap below to open Mail — pre-addressed to <strong>{mailPrompt.bizName}</strong>. Attach the PDF and send.
            </p>
            <div className="btn-row">
              <button className="btn btn-secondary" onClick={() => setMailPrompt(null)}>Close</button>
              <button className="btn btn-accent" onClick={() => { window.location.href = mailPrompt.mailtoUrl; setMailPrompt(null); }}>
                ✉️ Open Mail
              </button>
            </div>
          </div>
        </div>
      )}

      {confirmDelete && (
        <div className="modal-overlay" onClick={() => setConfirmDelete(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-handle" />
            <div className="modal-title">Delete Invoice?</div>
            <p style={{ color: 'var(--ink-soft)', marginBottom: 24 }}>
              This will permanently remove <strong>{confirmDelete.invoiceNumber}</strong>. This can't be undone.
            </p>
            <div className="btn-row">
              <button className="btn btn-secondary" onClick={() => setConfirmDelete(null)}>Cancel</button>
              <button className="btn btn-danger" onClick={() => handleDelete(confirmDelete.id)}>Delete</button>
            </div>
          </div>
        </div>
      )}

      {sorted.map(invoice => (
        <div className="invoice-item" key={invoice.id} style={{ flexDirection: 'column', alignItems: 'flex-start' }}>
          <div style={{ display: 'flex', width: '100%', alignItems: 'center' }}>
            <div className="invoice-item-info">
              <div className="invoice-item-num">
                <span className={`status-dot ${invoice.status === 'sent' ? 'sent' : 'draft'}`} />
                {invoice.invoiceNumber}
              </div>
              <div className="invoice-item-meta">{invoice.date} · {invoice.businessName || 'Snap Fitness'}</div>
            </div>
            <div className="invoice-item-amount">${invoice.total.toFixed(2)}</div>
          </div>
          <div className="invoice-actions">
            <button className="btn btn-secondary btn-sm" onClick={() => onEdit(invoice)}>✏️ Edit</button>
            <button className="btn btn-secondary btn-sm" onClick={() => handleDownload(invoice)}>⬇️ PDF</button>
            <button className="btn btn-accent btn-sm" onClick={() => handleEmail(invoice)}>✉️ Email</button>
            <button className="btn btn-secondary btn-sm" onClick={() => handleDuplicate(invoice)}>⧉ Copy</button>
            <button className="btn btn-danger btn-sm" onClick={() => setConfirmDelete(invoice)}>🗑</button>
          </div>
        </div>
      ))}
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState('new');
  const [invoices, setInvoices] = useState(loadInvoices);
  const [editingInvoice, setEditingInvoice] = useState(null);
  const [toast, setToast] = useState(null);
  const [showSettings, setShowSettings] = useState(false);
  const [settingsVersion, setSettingsVersion] = useState(0);
  const toastTimer = useRef(null);

  function showToast(msg) {
    clearTimeout(toastTimer.current);
    setToast(msg);
    toastTimer.current = setTimeout(() => setToast(null), 2800);
  }

  function handleSettingsSaved() {
    setSettingsVersion(v => v + 1);
  }

  function handleSave(invoice) {
    // Clear any invoice number override for this business
    const settings = loadSettings();
    const overrideKey = `invoiceOverride_${invoice.businessId}`;
    if (settings[overrideKey]) {
      const updated = { ...settings };
      delete updated[overrideKey];
      saveSettings(updated);
    }
    let updated;
    if (editingInvoice) {
      updated = invoices.map(i => i.id === invoice.id ? invoice : i);
      showToast('✓ Invoice updated');
    } else {
      updated = [...invoices, invoice];
      showToast('✓ Invoice saved');
    }
    setInvoices(updated);
    saveInvoices(updated);
    setEditingInvoice(null);
    setTab('list');
  }

  function handleEdit(invoice) {
    setEditingInvoice(invoice);
    setTab('new');
    window.scrollTo(0, 0);
  }

  function handleNewInvoice() {
    setEditingInvoice(null);
    setTab('new');
  }

  const settings = loadSettings();

  return (
    <div className="app">
      <div className="header">
        <div>
          <div className="header-title">Grace Invoices</div>
          <div className="header-sub">Snap Fitness · Fortnightly</div>
        </div>
        <button className="btn btn-ghost" onClick={() => setShowSettings(true)} style={{ fontSize: 22 }}>⚙️</button>
      </div>

      <div className="tabs">
        <button className={`tab ${tab === 'new' ? 'active' : ''}`} onClick={handleNewInvoice}>
          {editingInvoice ? '✏️ Editing' : '+ New Invoice'}
        </button>
        <button className={`tab ${tab === 'list' ? 'active' : ''}`} onClick={() => { setEditingInvoice(null); setTab('list'); }}>
          All Invoices {invoices.length > 0 && `(${invoices.length})`}
        </button>
      </div>

      <div className="content">
        {tab === 'new' && (
          <InvoiceForm
            key={editingInvoice?.id || `new-${settingsVersion}`}
            existing={editingInvoice}
            invoices={invoices}
            onSave={handleSave}
            onCancel={editingInvoice ? () => { setEditingInvoice(null); setTab('list'); } : null}
            showToast={showToast}
          />
        )}

        {tab === 'list' && (
          <InvoiceList
            invoices={invoices}
            setInvoices={setInvoices}
            onEdit={handleEdit}
            showToast={showToast}
          />
        )}
      </div>

      {showSettings && (
        <SettingsModal
          onClose={() => setShowSettings(false)}
          showToast={showToast}
          onSettingsSaved={handleSettingsSaved}
        />
      )}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
